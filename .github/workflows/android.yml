name: Android emulator checks
on:
  push:
    branches: [main]
    paths:
      [
        "android/**",
        "src/**",
        "public/**",
        "scripts/**",
        "package*.json",
        ".github/workflows/android.yml",
      ]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
      live_updates:
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  android:
    # Keep the Android SDK/KVM image stable when ubuntu-latest migrates.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Use disposable signing material for tests only
        run: |
          echo "DENKI_SIGNING_DIR=$RUNNER_TEMP/denki-test-signing" >> "$GITHUB_ENV"
          echo "DENKI_APK_OUTPUT=$RUNNER_TEMP/denki-ci.apk" >> "$GITHUB_ENV"
          echo "DENKI_LIVE_UPDATES=${{ inputs.live_updates && 'true' || 'false' }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install required components using the runner's Android SDK
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:?Hosted runner Android SDK is missing}"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm ci
      - run: npm run build:apk
      - name: Allow the disposable runner to use KVM
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_7
          disable-animations: true
          script: npm run test:android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-result
          path: android/build/smoke/result.txt
      - name: Summarize native test results
        if: always()
        run: |
          if [ -f android/build/smoke/result.txt ]; then
            {
              echo '### Android instrumentation result'
              echo '```text'
              tail -n 100 android/build/smoke/result.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
