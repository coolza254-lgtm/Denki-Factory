name: Publish signed APK
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.2.0
        required: true
        default: v0.2.0
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Verify tag and packaged APK
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 scripts/verify-release.py
          node -e 'if (process.env.RELEASE_TAG !== "v" + JSON.parse(require("fs").readFileSync("package.json")).version) process.exit(1)'
      - name: Publish already-signed APK (never generate a new signing key)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          apk="releases/denki-factory-${RELEASE_TAG#v}.apk"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$apk" releases/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" "$apk" releases/SHA256SUMS --verify-tag --title "Denki Factory $RELEASE_TAG" --notes-file "releases/$RELEASE_TAG.md"
          fi
